config:
  agent_mode: false
  description: Configuration for metagit CLI
  editor: code
  api_url: ''
  api_version: ''
  api_key: ''
  cicd_file_data: data/cicd-files.json
  file_type_data: data/file-types.json
  package_manager_data: data/package-managers.json
  llm:
    enabled: false
    provider: openrouter
    provider_model: gpt-4o-mini
    embedder: ollama
    embedder_model: nomic-embed-text
    api_key: ''
  workspace:
    path: ./.metagit
    session_path: .metagit/sessions
    campaigns_path: _campaigns
    worktrees_path: .worktrees
    dedupe:
      enabled: false
      scope: workspace
      strategy: symlink
      canonical_dir: _canonical
    ui_show_preview: true
    ui_menu_length: 10
    ui_preview_height: 3
    ui_ignore_hidden: true
  profiles:
  - name: default
    boundaries:
    - name: github
      values: []
    - name: jfrog
      values: []
    - name: gitlab
      values: []
    - name: bitbucket
      values: []
    - name: azure_devops
      values: []
    - name: dockerhub
      values: []
    - name: domain
      values:
      - localhost
      - 127.0.0.1
      - 0.0.0.0
      - 192.168.*
      - 10.0.*
      - 172.16.*
  providers:
    github:
      enabled: false
      api_token: ''
      base_url: https://api.github.com
    gitlab:
      enabled: false
      api_token: ''
      base_url: https://gitlab.com/api/v4
  state:
    backend: local
    url: ''
    token: ''
    conflict_retries: 1
    org_id: ''
    workspace_id: ''
    dynamodb:
      table: ''
      region: ''
      endpoint_url: ''
    mongodb:
      uri: ''
      database: ''
      collection: metagit_state
  merge:
    validators: []
